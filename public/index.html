<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hair Try-On - Experimente Penteados Virtualmente</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Hair Try-On</h1>
            <p>Experimente diferentes estilos de cabelo virtualmente</p>
        </header>

        <div class="main-content">
            <div class="camera-section">
                <div class="video-container">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="overlay"></canvas>
                </div>
                <div class="controls">
                    <button id="snapBtn" class="btn btn-primary">Tirar Foto</button>
                    <button id="resetBtn" class="btn btn-secondary">Limpar</button>
                    <button id="downloadBtn" class="btn btn-success">Descarregar</button>
                </div>
            </div>

            <div class="hairstyles-section">
                <h2>Penteados Masculinos</h2>
                <div class="hairstyles-grid" id="maleGrid"></div>

                <h2>Penteados Femininos</h2>
                <div class="hairstyles-grid" id="femaleGrid"></div>
            </div>
        </div>

        <div id="snapshotModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <canvas id="snapshotCanvas"></canvas>
                <button id="downloadSnapshot" class="btn btn-success">Descarregar Imagem</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
